name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  NODE_VERSION: "22.20.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            node-asset: win-x64
            bundles: nsis
          - name: macos-arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
            node-asset: darwin-arm64
            bundles: app,dmg
          - name: macos-x64
            os: macos-14
            rust-target: x86_64-apple-darwin
            node-asset: darwin-x64
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install dsh-runtime deps
        run: npm install --prefix dsh-runtime --no-audit --no-fund --ignore-scripts

      - name: Download bundled Node (win-x64)
        if: matrix.node-asset == 'win-x64'
        shell: pwsh
        run: |
          $v = $env:NODE_VERSION
          $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\node.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\node.zip" -DestinationPath "$env:RUNNER_TEMP\node" -Force
          Copy-Item "$env:RUNNER_TEMP\node\node-v$v-win-x64\node.exe" "$env:GITHUB_WORKSPACE\dsh-runtime\node.exe" -Force
          & "$env:GITHUB_WORKSPACE\dsh-runtime\node.exe" -v

      - name: Download bundled Node (darwin)
        if: matrix.node-asset != 'win-x64'
        shell: bash
        run: |
          set -e
          base="https://nodejs.org/dist/v$NODE_VERSION"
          cd "$RUNNER_TEMP"
          curl -sL -o node.tar.gz "$base/node-v$NODE_VERSION-${{ matrix.node-asset }}.tar.gz"
          tar -xzf node.tar.gz
          cp "node-v$NODE_VERSION-${{ matrix.node-asset }}/bin/node" "$GITHUB_WORKSPACE/dsh-runtime/node"
          chmod +x "$GITHUB_WORKSPACE/dsh-runtime/node"
          "$GITHUB_WORKSPACE/dsh-runtime/node" -v

      - name: Install project deps (Tauri CLI)
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Build (${{ matrix.name }})
        run: npx tauri build --bundles ${{ matrix.bundles }} --target ${{ matrix.rust-target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: src-tauri/target/release/bundle/**

      - name: Attach bundles to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          for f in src-tauri/target/release/bundle/**/*; do
            if [ -f "$f" ]; then gh release upload "$tag" "$f" --clobber; fi
          done
