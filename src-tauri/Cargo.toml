[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Tauri 2 desktop shell embedding DeepSeek Harness (dsh web) as a sidecar"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# tauri uses this lib for mobile targets and as the entry on desktop.
[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
